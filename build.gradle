plugins {
    id 'java'
    id 'application'
}

group = 'com.groupa13'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

// Detect Operating System for JavaFX dependencies
def osName = System.getProperty("os.name").toLowerCase()
def osClassifier = osName.contains("win") ? "win" : (osName.contains("mac") ? "mac" : "linux")

dependencies {
    // JavaFX
    implementation "org.openjfx:javafx-base:21:${osClassifier}"
    implementation "org.openjfx:javafx-controls:21:${osClassifier}"
    implementation "org.openjfx:javafx-fxml:21:${osClassifier}"
    implementation "org.openjfx:javafx-graphics:21:${osClassifier}"

    // Ikonli Font Icons
    implementation 'org.kordamp.ikonli:ikonli-core:12.3.1'
    implementation 'org.kordamp.ikonli:ikonli-javafx:12.3.1'
    implementation 'org.kordamp.ikonli:ikonli-fontawesome5-pack:12.3.1'

    // PostgreSQL persistence and migration baseline
    implementation 'org.postgresql:postgresql:42.7.13'
    implementation 'com.zaxxer:HikariCP:7.1.0'
    implementation 'org.flywaydb:flyway-core:13.8.0'
    implementation 'org.flywaydb:flyway-database-postgresql:13.8.0'
    implementation 'org.mindrot:jbcrypt:0.4'

    // JUnit 5 and PostgreSQL Testcontainers
    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.2'
    testImplementation platform('org.testcontainers:testcontainers-bom:2.0.5')
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'com.groupa13.disasterrelief.Main'
}

// Pass JavaFX modules via --module-path and --add-modules at runtime
tasks.named('run', JavaExec) {
    doFirst {
        def jfxJars = configurations.runtimeClasspath.filter { it.name.contains("javafx") }
        jvmArgs = [
            "--module-path", jfxJars.asPath,
            "--add-modules", "javafx.controls,javafx.fxml"
        ]
    }
}

tasks.named('test', Test) {
    useJUnitPlatform()
    testLogging {
        events 'failed', 'skipped'
        exceptionFormat = 'full'
    }
}

// ── Source sets ───────────────────────────────────────────────────────────────
sourceSets {
    main {
        java   { srcDirs = ['src/main/java'] }
        resources { srcDirs = ['src/main/resources'] }
    }
}
